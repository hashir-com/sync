name: sync_event
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+7

environment:
  sdk: ^3.9.2

dependencies:
  
  # Core Flutter SDK
  
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  
  # UI / Design / UX
  
  cupertino_icons: ^1.0.8          # iOS style icons
  flutter_svg: ^2.0.10             # SVG image rendering
  font_awesome_flutter: ^10.7.0    # FontAwesome icons
  google_fonts: ^6.2.1             # Google Fonts integration
  smooth_page_indicator: ^1.2.0    # PageView indicators
  shimmer: ^3.0.0                  # Skeleton loading UI
  flow_drawer: ^0.0.3              # Animated drawer UI

  
  # Clean Architecture / DI
  
  dartz: ^0.10.1                   # Functional programming (Either, Option)
  equatable: ^2.0.5                # Value equality for states/entities
  get_it: ^8.0.3                   # Dependency injection (service locator)
  injectable: ^2.4.4               # Code-gen DI for get_it

  
  # State Management
  
  flutter_riverpod: ^2.6.1         # Riverpod state management
  riverpod_annotation: ^2.6.1      # Riverpod code generation support

  
  # Firebase Core & Services
  
  firebase_core: ^3.8.1            # Firebase initialization
  firebase_auth: ^5.3.4            # Authentication
  cloud_firestore: ^5.6.12         # Firestore database
  firebase_storage: ^12.3.7        # File storage

  
  # Authentication
  
  google_sign_in: ^6.3.0            # Google OAuth login

  
  # Navigation & Routing
  
  go_router: ^14.6.2               # Declarative navigation

  
  # Local Storage
  
  shared_preferences: ^2.3.4       # Key-value local storage

  
  # Networking & Reactive Streams
  
  http: ^1.5.0                     # REST API calls
  rxdart: ^0.28.0                  # Reactive extensions

  
  # Maps, Location & Places
  
  google_maps_flutter: ^2.10.0     # Google Maps
  location: ^7.0.0                 # Location access
  geolocator: ^13.0.2              # Advanced geolocation
  geocoding: ^3.0.0                # LatLng to address
  flutter_google_places_sdk: any   # Google Places API

  
  # Permissions & System Access
  
  permission_handler: ^11.3.1      # Runtime permissions
  url_launcher: ^6.3.2             # Open URLs, calls, emails

  
  # Files, Images & Media
  
  file_picker: ^8.1.4              # Pick files
  image_picker: ^1.2.0             # Pick images from camera/gallery
  image: ^4.5.4                    # Image processing
  open_file: ^3.5.10               # Open files with native apps

  
  # Caching & Performance
  
  flutter_cache_manager: ^3.4.1    # Cache network files
  cached_network_image: ^3.4.1     # Cached image widget

  
  # Date, Time & Utilities
  
  intl: ^0.20.2                    # Date & number formatting
  collection: ^1.19.1              # Collection helpers
  uuid: ^4.5.1                     # Unique ID generation
  share_plus: ^12.0.1              # Share content
  flutter_dotenv: ^6.0.0            # Environment variables

  
  # Calendar & Scheduling
  
  table_calendar: ^3.1.3           # Simple calendar UI
  syncfusion_flutter_calendar: ^29.2.5 # Advanced calendar

  
  # Payments & Communication
  
  razorpay_flutter: ^1.4.0         # Razorpay payments
  mailer: ^6.5.0                   # Send emails

  
  # PDF & Printing
  
  pdf: ^3.11.1                     # PDF generation
  printing: ^5.13.4                # Print & preview PDFs

dev_dependencies:
  
  # Testing & Linting
  
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0            # Recommended lint rules

  
  # Code Generation
  
  injectable_generator: ^2.6.2     # DI code generation
  build_runner: ^2.4.13            # Code generator runner

  # App Assets
  
  flutter_launcher_icons: ^0.14.4  # App icon generation

flutter:
  uses-material-design: true

  assets:
    - assets/images/onboarding1.png
    - assets/images/onboarding2.png
    - assets/images/sync_logo_icon.png
    - .env
